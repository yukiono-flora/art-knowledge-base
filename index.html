<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTナレッジベース</title>
<style>
  :root {
    --navy: #1F3A52;
    --blue: #365D81;
    --blue-soft: #E8EEF3;
    --gray-body: #55606B;
    --gray-line: #DDE3E8;
    --bg: #FAFBFC;
    --white: #FFFFFF;
    --red: #B23A3A;
    --amber: #C08A2E;
    --green: #3D7A54;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    color: #33393F;
    font-size: 15.5px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--gray-line);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: baseline; gap: 12px; }
  .header-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
  .header-sub {
    font-size: 12px;
    color: #8A95A0;
  }
  .badge-confidential {
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* Toolbar */
  .toolbar {
    padding: 20px 32px 0;
    max-width: 1600px;
    margin: 0 auto;
  }
  .search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .search-input {
    flex: 1;
    padding: 11px 16px;
    border: 1px solid var(--gray-line);
    border-radius: 8px;
    font-size: 14px;
    background: var(--white);
    color: var(--navy);
  }
  .search-input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }
  .new-only-toggle {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--gray-line);
    background: var(--white);
    color: #9AA3AB;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .new-only-toggle.active {
    background: #0F6E56;
    border-color: #0F6E56;
    color: var(--white);
  }
  .add-news-btn {
    padding: 0 20px;
    border: none;
    background: var(--blue);
    color: var(--white);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-news-btn:hover { background: var(--blue-dark); }
  .add-news-form {
    background: var(--white);
    border: 1px solid var(--gray-line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .form-row {
    display: flex;
    gap: 8px;
  }
  .form-row input, .form-row select, .add-news-form textarea {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--gray-line);
    border-radius: 7px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .add-news-submit-btn {
    padding: 9px 20px;
    border: none;
    background: var(--navy);
    color: var(--white);
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .form-note {
    font-size: 12px;
    color: var(--blue);
    min-height: 16px;
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--gray-line);
    background: var(--white);
    font-size: 13px;
    color: var(--gray-body);
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--blue); }
  .chip.active {
    background: var(--blue);
    border-color: var(--blue);
    color: var(--white);
  }
  .region-chip {
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--gray-line);
    background: var(--white);
    font-size: 12px;
    color: #9AA3AB;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .region-chip:hover { border-color: #B8C0C7; color: #6B7580; }
  .region-chip.active {
    background: #F1F3F5;
    border-color: #C7CDD3;
    color: #4A5158;
    font-weight: 600;
  }
  .count-line-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 14px 2px 18px;
  }
  .count-line {
    font-size: 12px;
    color: #8A95A0;
  }
  .report-link {
    font-size: 12px;
    color: var(--blue);
    font-weight: 500;
    cursor: pointer;
  }
  .report-link:hover { text-decoration: underline; }

  /* Cards */
  .grid {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 32px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--gray-line);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    flex-wrap: wrap;
  }
  .field-tag {
    font-size: 13px;
    font-weight: 700;
    padding: 3px 0 3px 10px;
    border-left: 4px solid;
    white-space: nowrap;
    line-height: 1.3;
    background: none;
  }
  .region-tag {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    color: #6B7580;
  }
  .region-tag::before {
    content: "#";
    color: #B7BEC4;
  }
  .pending-tag {
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    background: #FAEEDA;
    color: #633806;
  }
  .new-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--red);
    padding: 4px 12px 4px 16px;
    letter-spacing: 0.03em;
    white-space: nowrap;
    clip-path: polygon(0 50%, 10px 0, 100% 0, 100% 100%, 10px 100%);
  }
  .card-top-right {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .card-top-row2 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .hashtag-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .card-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.5;
  }
  .card-title a { color: inherit; text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }

  .card-summary {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 13px;
    line-height: 1.75;
    color: var(--gray-body);
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    color: #9AA3AB;
    border-top: 1px solid var(--gray-line);
    padding-top: 10px;
    margin-top: 2px;
  }
  .source-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    background: #F1F3F5;
    color: #6B7580;
  }
  .card-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .interest-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border: 1px solid var(--gray-line);
    border-radius: 6px;
    background: var(--white);
    color: var(--gray-body);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .interest-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
  }
  .interest-btn.active {
    background: var(--blue-soft);
    border-color: var(--blue);
    color: var(--blue);
    font-weight: 600;
  }
  .not-interest-btn.active {
    background: #F1E4E4;
    border-color: var(--red);
    color: var(--red);
    font-weight: 600;
  }
  .memo-section {
    border-top: 1px solid var(--gray-line);
    padding-top: 12px;
    margin-top: 2px;
  }
  .memo-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-body);
    margin-bottom: 8px;
    cursor: pointer;
  }
  .memo-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .memo-item {
    background: var(--bg);
    border-radius: 6px;
    padding: 7px 10px;
  }
  .memo-item-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .memo-author {
    font-size: 12px;
    font-weight: 600;
    color: var(--navy);
  }
  .memo-date {
    font-size: 11px;
    color: #9AA3AB;
  }
  .memo-content {
    font-size: 12.5px;
    color: var(--gray-body);
    line-height: 1.6;
  }
  .memo-input-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .memo-input-top-row {
    display: flex;
    gap: 6px;
  }
  .memo-name-input {
    width: 110px;
    flex-shrink: 0;
    padding: 7px 8px;
    border: 1px solid var(--gray-line);
    border-radius: 6px;
    font-size: 12.5px;
  }
  .memo-input {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--gray-line);
    border-radius: 6px;
    font-size: 12.5px;
  }
  .memo-submit-btn {
    align-self: flex-end;
    padding: 7px 16px;
    border: 1px solid var(--blue);
    background: var(--blue);
    color: var(--white);
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .memo-submit-btn:hover {
    background: var(--blue-dark);
  }
  .edit-toggle-btn {
    cursor: pointer;
    font-size: 13px;
    padding: 3px;
    opacity: 0.6;
  }
  .edit-toggle-btn:hover { opacity: 1; }
  .edit-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: var(--bg);
    border: 1px solid var(--gray-line);
    border-radius: 8px;
    padding: 10px;
  }
  .edit-form input, .edit-form select, .edit-form textarea {
    padding: 7px 9px;
    border: 1px solid var(--gray-line);
    border-radius: 6px;
    font-size: 12.5px;
    font-family: inherit;
    width: 100%;
  }
  .edit-form .form-row {
    display: flex;
    gap: 6px;
  }
  .edit-form .form-row select, .edit-form .form-row input {
    flex: 1;
  }
  .edit-save-btn {
    padding: 7px 14px;
    border: none;
    border-radius: 6px;
    background: var(--blue);
    color: var(--white);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .edit-cancel-btn {
    padding: 7px 14px;
    border: 1px solid var(--gray-line);
    border-radius: 6px;
    background: var(--white);
    color: var(--gray-body);
    font-size: 12.5px;
    cursor: pointer;
  }

  .empty-state {
    max-width: 1120px;
    margin: 40px auto;
    text-align: center;
    color: #9AA3AB;
    font-size: 14px;
    padding: 60px 20px;
  }
  .loading-state, .error-state {
    max-width: 1120px;
    margin: 40px auto;
    text-align: center;
    color: #9AA3AB;
    font-size: 14px;
    padding: 60px 20px;
  }
  .error-state { color: #B23A3A; }
  .retry-btn {
    margin-top: 12px;
    padding: 8px 18px;
    border: 1px solid var(--blue);
    color: var(--blue);
    background: var(--white);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title">ARTナレッジベース</div>
    <div class="header-sub">ARCS Inc. / 内部参照用プロトタイプ</div>
  </div>
  <div style="width:1px;"></div>
</div>

<div class="toolbar">
  <div class="search-row">
    <input class="search-input" id="searchInput" type="text" placeholder="キーワードで検索(タイトル・要約)">
    <button class="add-news-btn" id="addNewsBtn">+ ニュースを追加</button>
  </div>
  <div class="add-news-form" id="reportPanel" style="display:none;"></div>
  <div class="add-news-form" id="addNewsForm" style="display:none;">
    <div class="form-row">
      <input type="text" id="formUrl" placeholder="ニュース記事のURLを貼り付け">
      <button class="add-news-submit-btn" id="addNewsSubmitBtn">登録する</button>
    </div>
    <div class="form-row" id="formFallbackRow" style="display:none;">
      <input type="text" id="formFallbackTitle" placeholder="タイトルを入力してください">
    </div>
    <div style="font-size:11.5px;color:#9AA3AB;">
      タイトル・分野・重要度・国・要約はAIが翌朝までにまとめて判定します。
    </div>
    <div class="form-note" id="formNote"></div>
  </div>
  <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
    <span id="newOnlyToggle" class="new-only-toggle active">🆕 新着のみ表示</span>
    <span style="font-size:11.5px; color:#9AA3AB;">(公開から48時間以内の記事のみ表示中。解除するとすべて表示されます)</span>
  </div>
  <div class="chip-row" id="fieldChips"></div>
  <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
    <span style="font-size:12px; color:#8A95A0; flex-shrink:0;">部門:</span>
    <div class="chip-row" id="departmentChips" style="margin-bottom:0;"></div>
  </div>
  <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
    <span style="font-size:12px; color:#8A95A0; flex-shrink:0;">国:</span>
    <div class="chip-row" id="regionChips" style="margin-bottom:0;"></div>
  </div>
  <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
    <span style="font-size:12px; color:#8A95A0; flex-shrink:0;">月:</span>
    <div class="chip-row" id="monthChips" style="margin-bottom:0;"></div>
  </div>
  <div class="count-line-row">
    <span class="count-line" id="countLine"></span>
    <span class="report-link" id="reportToggleBtn">📊 直近の週次レポートを見る →</span>
  </div>
</div>

<div class="grid" id="cardGrid"></div>
<div class="empty-state" id="emptyState" style="display:none;">該当する記事がありません。検索条件を変えてみてください。</div>
<div class="loading-state" id="loadingState">データを読み込んでいます...</div>
<div class="error-state" id="errorState" style="display:none;">
  データの取得に失敗しました。<br>
  <button class="retry-btn" id="retryBtn">再読み込み</button>
</div>

<script>
// GAS Web App のURL(ARTナレッジベース スプレッドシート用API)
const API_URL = "https://script.google.com/a/macros/arcs-inc.jp/s/AKfycbydHNsQDTKuJHWL8a5I1e5hvO-NyfHVDRk2rsARNZ4-FuNNmQ-2ab1zOviRCvCmLTlcQA/exec";

const IMPORTANCE_MAP = { "高": "high", "中": "mid", "低": "low" };

const FIELDS = ["すべて", "ART/生殖医療テクノロジー動向", "規制・政策動向", "学術研究", "業界動向・統計", "その他"];
const DEPARTMENTS = ["すべて", "開発", "臨床開発", "品質保証", "薬事", "事業開発"];
let REGIONS = ["すべて"];
let MONTHS = ["すべて"];
let activeField = "すべて";
let activeDepartment = "すべて";
let activeRegion = "すべて";
let activeMonth = "すべて";
let showNewOnly = true; // 初期表示は新着のみに絞る
let query = "";

function updateRegionsFromData() {
  const uniqueRegions = [...new Set(DATA.map(item => item.region).filter(Boolean))];
  uniqueRegions.sort((a, b) => a.localeCompare(b, "ja")); // あいうえお順
  REGIONS = ["すべて", ...uniqueRegions];
}

// 複数国が含まれる場合(例:"デンマーク, アメリカ")は「グローバル」として扱う
function normalizeRegion(region) {
  if (!region) return "";
  const hasMultiple = /[,、]/.test(region) || /[・&]/.test(region);
  return hasMultiple ? "グローバル" : region.trim();
}

// ISO形式の日付文字列を "2026-08-19" のような表示用に整形する
function formatDisplayDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  if (isNaN(d)) return String(dateStr);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function itemMonthLabel(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return `${d.getFullYear()}年${d.getMonth() + 1}月`;
}

function updateMonthsFromData() {
  const uniqueMonths = [...new Set(DATA.map(item => itemMonthLabel(item.date)).filter(Boolean))];
  // 新しい月が先頭に来るように、実際の年月値で降順ソート
  uniqueMonths.sort((a, b) => {
    const parse = (s) => {
      const m = s.match(/(\d+)年(\d+)月/);
      return m ? parseInt(m[1]) * 100 + parseInt(m[2]) : 0;
    };
    return parse(b) - parse(a);
  });
  MONTHS = ["すべて", ...uniqueMonths];
}
let DATA = [];
let MEMOS = {};
let REPORTS = []; // { "記事ID": [{author, content, date}, ...] }

// GAS Web AppはCORSに対応していないため、<script>タグを使うJSONP方式でデータを取得する
function loadData() {
  document.getElementById("loadingState").style.display = "block";
  document.getElementById("errorState").style.display = "none";
  document.getElementById("cardGrid").innerHTML = "";
  document.getElementById("emptyState").style.display = "none";

  const callbackName = "artKbCallback_" + Date.now();
  let settled = false;

  const timeoutId = setTimeout(() => {
    if (!settled) {
      settled = true;
      handleLoadError(new Error("タイムアウト"));
    }
  }, 15000);

  window[callbackName] = function (json) {
    if (settled) return;
    settled = true;
    clearTimeout(timeoutId);
    delete window[callbackName];
    script.remove();

    DATA = (json.items || []).map(item => ({
      id: item["ID"],
      title: item["タイトル"],
      field: item["分野"],
      importance: IMPORTANCE_MAP[item["重要度"]] || "mid",
      importanceLabel: item["重要度"] || "中",
      summary: item["要約"],
      source: item["ソース種別"],
      poster: item["投稿者"],
      date: item["公開日"],
      registeredAt: item["登録日時"],
      region: normalizeRegion(item["国"]),
      departments: (item["部門"] || "").split(",").map(d => d.trim()).filter(Boolean),
      status: item["ステータス"] || "",
      url: item["元URL"]
    }));

    // 新着順(記事の公開日が新しい順)に並び替え
    DATA.sort((a, b) => new Date(b.date) - new Date(a.date));

    MEMOS = json.memos || {};
    REPORTS = json.reports || [];

    updateRegionsFromData();
    updateMonthsFromData();

    document.getElementById("loadingState").style.display = "none";
    render();
  };

  const script = document.createElement("script");
  script.src = API_URL + "?callback=" + callbackName;
  script.onerror = () => {
    if (!settled) {
      settled = true;
      clearTimeout(timeoutId);
      delete window[callbackName];
      handleLoadError(new Error("スクリプト読み込み失敗"));
    }
  };
  document.body.appendChild(script);
}

function handleLoadError(err) {
  document.getElementById("loadingState").style.display = "none";
  document.getElementById("errorState").style.display = "block";
  console.error("データ取得エラー:", err);
}

document.getElementById("retryBtn").addEventListener("click", loadData);

function renderChips() {
  const fieldEl = document.getElementById("fieldChips");
  fieldEl.innerHTML = FIELDS.map(f =>
    `<div class="chip ${f === activeField ? "active" : ""}" data-field="${f}">${f}</div>`
  ).join("");
  fieldEl.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeField = chip.dataset.field;
      render();
    });
  });

  const regionEl = document.getElementById("regionChips");
  regionEl.innerHTML = REGIONS.map(r =>
    `<div class="region-chip ${r === activeRegion ? "active" : ""}" data-region="${r}">${r}</div>`
  ).join("");
  regionEl.querySelectorAll(".region-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeRegion = chip.dataset.region;
      render();
    });
  });

  const deptEl = document.getElementById("departmentChips");
  deptEl.innerHTML = DEPARTMENTS.map(d =>
    `<div class="region-chip ${d === activeDepartment ? "active" : ""}" data-department="${d}">${d}</div>`
  ).join("");
  deptEl.querySelectorAll(".region-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeDepartment = chip.dataset.department;
      render();
    });
  });

  const monthEl = document.getElementById("monthChips");
  monthEl.innerHTML = MONTHS.map(m =>
    `<div class="region-chip ${m === activeMonth ? "active" : ""}" data-month="${m}">${m}</div>`
  ).join("");
  monthEl.querySelectorAll(".region-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeMonth = chip.dataset.month;
      render();
    });
  });
}

function render() {
  renderChips();
  const q = query.trim().toLowerCase();
  const filtered = DATA.filter(item => {
    const matchesField = activeField === "すべて" || item.field === activeField;
    const matchesDepartment = activeDepartment === "すべて" || item.departments.includes(activeDepartment);
    const matchesRegion = activeRegion === "すべて" || item.region === activeRegion;
    const matchesMonth = activeMonth === "すべて" || itemMonthLabel(item.date) === activeMonth;
    const matchesQuery = !q || item.title.toLowerCase().includes(q) || item.summary.toLowerCase().includes(q);
    const matchesNewOnly = !showNewOnly || isNewItem(item.date);
    return matchesField && matchesDepartment && matchesRegion && matchesMonth && matchesQuery && matchesNewOnly;
  });

  document.getElementById("countLine").textContent = `${filtered.length}件表示中(全${DATA.length}件)`;

  const grid = document.getElementById("cardGrid");
  const empty = document.getElementById("emptyState");

  if (filtered.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = filtered.map(item => `
    <div class="card">
      <div class="card-top">
        ${item.status === "判定待ち"
          ? `<span class="pending-tag">⏳ 判定待ち(翌朝までに自動分類されます)</span>`
          : `<span class="field-tag" style="${fieldTagStyle(item.field)}">${item.field}</span>`}
        <span class="edit-toggle-btn" data-edit-id="${item.id}" title="編集">✏️</span>
      </div>
      <div class="card-top-row2">
        <div class="hashtag-row">
          ${item.departments.map(d => `<span class="region-tag">${d}</span>`).join("")}
          ${item.region ? `<span class="region-tag">${item.region}</span>` : ""}
        </div>
        ${isNewItem(item.date) ? '<span class="new-badge">NEW</span>' : ""}
      </div>
      <div class="card-title" data-title-id="${item.id}"><a href="${item.url}" target="_blank" rel="noopener">${item.title}</a></div>
      <div class="card-summary" data-summary-id="${item.id}">${item.summary}</div>
      <div class="edit-form" data-edit-form-id="${item.id}" style="display:none;">
        <input type="text" class="edit-title-input" data-id="${item.id}" value="${escapeAttr(item.title)}" placeholder="タイトル">
        <input type="text" class="edit-url-input" data-id="${item.id}" value="${escapeAttr(item.url)}" placeholder="URL">
        <div class="form-row">
          <select class="edit-field-select" data-id="${item.id}">
            <option value="ART/生殖医療テクノロジー動向" ${item.field === "ART/生殖医療テクノロジー動向" ? "selected" : ""}>ART/生殖医療テクノロジー動向</option>
            <option value="規制・政策動向" ${item.field === "規制・政策動向" ? "selected" : ""}>規制・政策動向</option>
            <option value="学術研究" ${item.field === "学術研究" ? "selected" : ""}>学術研究</option>
            <option value="業界動向・統計" ${item.field === "業界動向・統計" ? "selected" : ""}>業界動向・統計</option>
          </select>
          <input type="text" class="edit-country-input" data-id="${item.id}" value="${escapeAttr(item.region)}" placeholder="国">
          <select class="edit-importance-select" data-id="${item.id}">
            <option value="高" ${item.importanceLabel === "高" ? "selected" : ""}>重要度: 高</option>
            <option value="中" ${item.importanceLabel === "中" ? "selected" : ""}>重要度: 中</option>
            <option value="低" ${item.importanceLabel === "低" ? "selected" : ""}>重要度: 低</option>
          </select>
        </div>
        <textarea class="edit-summary-input" data-id="${item.id}" rows="2" placeholder="要約">${escapeAttr(item.summary)}</textarea>
        <div class="form-row">
          <button class="edit-save-btn" data-id="${item.id}">保存</button>
          <button class="edit-cancel-btn" data-id="${item.id}">キャンセル</button>
        </div>
      </div>
      <div class="card-meta">
        <span class="source-badge">${item.source}${item.poster ? " ・ " + item.poster : ""}</span>
        <span>${formatDisplayDate(item.date)}</span>
      </div>
      <div class="card-actions">
        <button class="interest-btn ${feedbackState[item.id] === "interested" ? "active" : ""}"
          data-id="${item.id}" data-title="${escapeAttr(item.title)}" data-field="${escapeAttr(item.field)}" data-type="interested">
          👍 興味あり
        </button>
        <button class="interest-btn not-interest-btn ${feedbackState[item.id] === "not_interested" ? "active" : ""}"
          data-id="${item.id}" data-title="${escapeAttr(item.title)}" data-field="${escapeAttr(item.field)}" data-type="not_interested">
          👎 興味なし
        </button>
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".interest-btn").forEach(btn => {
    btn.addEventListener("click", () => onInterestClick(btn));
  });

  grid.querySelectorAll(".edit-toggle-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.editId;
      const form = grid.querySelector(`.edit-form[data-edit-form-id="${id}"]`);
      const titleEl = grid.querySelector(`.card-title[data-title-id="${id}"]`);
      const summaryEl = grid.querySelector(`.card-summary[data-summary-id="${id}"]`);
      const opening = form.style.display === "none";
      form.style.display = opening ? "flex" : "none";
      titleEl.style.display = opening ? "none" : "block";
      summaryEl.style.display = opening ? "none" : "block";
    });
  });

  grid.querySelectorAll(".edit-cancel-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.id;
      grid.querySelector(`.edit-form[data-edit-form-id="${id}"]`).style.display = "none";
      grid.querySelector(`.card-title[data-title-id="${id}"]`).style.display = "block";
      grid.querySelector(`.card-summary[data-summary-id="${id}"]`).style.display = "block";
    });
  });

  grid.querySelectorAll(".edit-save-btn").forEach(btn => {
    btn.addEventListener("click", () => onEditSave(btn));
  });
}

function onEditSave(btn) {
  const id = btn.dataset.id;
  const grid = document.getElementById("cardGrid");

  const title = grid.querySelector(`.edit-title-input[data-id="${id}"]`).value.trim();
  const url = grid.querySelector(`.edit-url-input[data-id="${id}"]`).value.trim();
  const field = grid.querySelector(`.edit-field-select[data-id="${id}"]`).value;
  const country = grid.querySelector(`.edit-country-input[data-id="${id}"]`).value.trim();
  const importance = grid.querySelector(`.edit-importance-select[data-id="${id}"]`).value;
  const summary = grid.querySelector(`.edit-summary-input[data-id="${id}"]`).value.trim();

  if (!title) return;

  // ローカルのDATAも即時更新して見た目に反映
  const item = DATA.find(d => String(d.id) === String(id));
  if (item) {
    item.title = title;
    item.url = url;
    item.field = field;
    item.region = country;
    item.importance = IMPORTANCE_MAP[importance] || "mid";
    item.importanceLabel = importance;
    item.summary = summary;
  }

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    credentials: "include",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "updateArticle", id: id, title, url, field, country, importance, summary })
  }).catch(err => console.error("編集保存エラー:", err));

  render();
}

function onMemoSubmit(btn) {
  const id = btn.dataset.id;
  const input = document.querySelector(`.memo-input[data-id="${id}"]`);
  const nameInput = document.querySelector(`.memo-name-input[data-id="${id}"]`);
  const content = input.value.trim();
  if (!content) return;

  const rawName = nameInput.value.trim();
  const author = rawName || "匿名";
  localStorage.setItem("artKbAuthorName", rawName); // 空欄なら次回も空欄のまま(=匿名希望を記憶)
  savedAuthorName = rawName;

  if (!MEMOS[id]) MEMOS[id] = [];
  MEMOS[id].push({ author, content, date: "たった今" });
  input.value = "";
  render();

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    credentials: "include",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "addMemo", id: id, author: author, content: content })
  }).catch(err => console.error("メモ送信エラー:", err));
}

function escapeAttr(str) {
  return String(str || "").replace(/"/g, "&quot;");
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

// Slackのmrkdwn記法(<url|タイトル>、*太字*)をHTML表示用に変換する
function formatReportContent(content) {
  let html = escapeHtml(content);
  // <url|テキスト> → リンク
  html = html.replace(/&lt;(https?:\/\/[^|&]+)\|([^&]+?)&gt;/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--blue);">$2</a>');
  // *太字*
  html = html.replace(/\*([^*]+)\*/g, '<strong>$1</strong>');
  // _斜体_(分野の見出しに使われている)
  html = html.replace(/_([^_]+)_/g, '<em>$1</em>');
  return html;
}

const FIELD_COLORS = {
  "ART/生殖医療テクノロジー動向": { bg: "#EEEDFE", color: "#3C3489" },
  "規制・政策動向": { bg: "#FAECE7", color: "#712B13" },
  "学術研究": { bg: "#E1F5EE", color: "#085041" },
  "業界動向・統計": { bg: "#FAEEDA", color: "#633806" },
  "その他": { bg: "#F1F3F5", color: "#5A6570" }
};

function fieldTagStyle(field) {
  const c = FIELD_COLORS[field] || { bg: "#F1F3F5", color: "#6B7580" };
  return `border-left-color:${c.color};color:${c.color};`;
}

function isNewItem(publishDate) {
  if (!publishDate) return false;
  const published = new Date(publishDate);
  const hoursSince = (Date.now() - published.getTime()) / 3600000;
  return hoursSince <= 48; // 公開から48時間以内はNEW扱い
}

// { "記事ID": "interested" | "not_interested" } の形でブラウザに保存
let feedbackState = JSON.parse(localStorage.getItem("artKbFeedback") || "{}");
let savedAuthorName = localStorage.getItem("artKbAuthorName") || "";

function onInterestClick(btn) {
  const id = btn.dataset.id;
  const type = btn.dataset.type; // "interested" or "not_interested"
  const current = feedbackState[id];

  // 同じボタンをもう一度押したら「取り消し(未評価に戻す)」
  const newState = current === type ? null : type;

  if (newState) {
    feedbackState[id] = newState;
  } else {
    delete feedbackState[id];
  }
  localStorage.setItem("artKbFeedback", JSON.stringify(feedbackState));
  render(); // ボタンの見た目を更新

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    credentials: "include",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      action: "feedback",
      id: id,
      title: btn.dataset.title,
      field: btn.dataset.field,
      type: newState || "cancel" // 取り消した場合は "cancel" として記録
    })
  }).catch(err => console.error("フィードバック送信エラー:", err));
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  query = e.target.value;
  render();
});

document.getElementById("newOnlyToggle").addEventListener("click", () => {
  showNewOnly = !showNewOnly;
  const el = document.getElementById("newOnlyToggle");
  el.classList.toggle("active", showNewOnly);
  render();
});

document.getElementById("addNewsBtn").addEventListener("click", () => {
  const form = document.getElementById("addNewsForm");
  form.style.display = form.style.display === "none" ? "flex" : "none";
});

document.getElementById("reportToggleBtn").addEventListener("click", () => {
  const panel = document.getElementById("reportPanel");

    renderReportPanel();
    panel.style.display = "flex";
  } else {
    panel.style.display = "none";
  }
});

function renderReportPanel() {
  const panel = document.getElementById("reportPanel");
  if (REPORTS.length === 0) {
    panel.innerHTML = `<div style="font-size:13px;color:#9AA3AB;">まだ週次レポートは送信されていません。</div>`;
    return;
  }
  panel.innerHTML = REPORTS.map((r, idx) => `
    <div style="border:1px solid var(--gray-line);border-radius:8px;">
      <div class="report-header" data-report-idx="${idx}" style="padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--navy);display:flex;justify-content:space-between;">
        <span>📅 ${escapeHtml(r.period)}(送信: ${escapeHtml(r.sentAt)})</span>
        <span style="color:#9AA3AB;font-weight:400;">クリックで開閉</span>
      </div>
      <div class="report-body" data-report-body-idx="${idx}" style="display:none;padding:0 14px 14px;white-space:pre-wrap;font-size:12.5px;line-height:1.7;color:var(--gray-body);">${formatReportContent(r.content)}</div>
    </div>
  `).join("");

  panel.querySelectorAll(".report-header").forEach(header => {
    header.addEventListener("click", () => {
      const body = panel.querySelector(`.report-body[data-report-body-idx="${header.dataset.reportIdx}"]`);
      body.style.display = body.style.display === "none" ? "block" : "none";
    });
  });
}

document.getElementById("addNewsSubmitBtn").addEventListener("click", () => {
  const url = document.getElementById("formUrl").value.trim();
  const fallbackTitle = document.getElementById("formFallbackTitle").value.trim();

  if (!url) {
    document.getElementById("formNote").textContent = "URLを入力してください";
    return;
  }

  const submitBtn = document.getElementById("addNewsSubmitBtn");
  submitBtn.disabled = true;
  document.getElementById("formNote").textContent = "登録中...";

  const callbackName = "artKbAddCallback_" + Date.now();
  const timeoutId = setTimeout(() => {
    if (window[callbackName]) {
      delete window[callbackName];
      submitBtn.disabled = false;
      document.getElementById("formNote").textContent = "応答がありませんでした。時間をおいて再度お試しください。";
    }
  }, 20000);

  window[callbackName] = function (result) {
    clearTimeout(timeoutId);
    delete window[callbackName];
    submitBtn.disabled = false;

    if (result.status === "ok") {
      document.getElementById("formNote").textContent = "登録しました。「判定待ち」の状態で表示されます(翌朝AIが分野・重要度・国を判定します)。画面を再読み込みしてください。";
      document.getElementById("formUrl").value = "";
      document.getElementById("formFallbackTitle").value = "";
      document.getElementById("formFallbackRow").style.display = "none";
    } else if (result.status === "skipped" && result.reason === "duplicate_url") {
      document.getElementById("formNote").textContent = "このURLはすでに登録済みです。";
    } else if (result.reason === "title_not_found") {
      document.getElementById("formFallbackRow").style.display = "flex";
      document.getElementById("formNote").textContent = "ページからタイトルを自動取得できませんでした。上の欄にタイトルを入力して、もう一度「登録する」を押してください。";
    } else {
      document.getElementById("formNote").textContent = "登録に失敗しました。URLが正しいか確認してください。";
    }
  };

  const script = document.createElement("script");
  script.src = API_URL + "?action=manualAdd&url=" + encodeURIComponent(url)
    + "&fallbackTitle=" + encodeURIComponent(fallbackTitle)
    + "&callback=" + callbackName;
  script.onerror = () => {
    clearTimeout(timeoutId);
    delete window[callbackName];
    submitBtn.disabled = false;
    document.getElementById("formNote").textContent = "通信に失敗しました。もう一度お試しください。";
  };
  document.body.appendChild(script);
});

loadData();
