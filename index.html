<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTナレッジベース</title>
<style>
  :root {
    --navy: #1F3A52;
    --blue: #365D81;
    --blue-soft: #E8EEF3;
    --gray-body: #55606B;
    --gray-line: #DDE3E8;
    --bg: #FAFBFC;
    --white: #FFFFFF;
    --red: #B23A3A;
    --amber: #C08A2E;
    --green: #3D7A54;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    color: var(--gray-body);
  }

  /* Header */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--gray-line);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: baseline; gap: 12px; }
  .header-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
  .header-sub {
    font-size: 12px;
    color: #8A95A0;
  }
  .badge-confidential {
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* Toolbar */
  .toolbar {
    padding: 20px 32px 0;
    max-width: 1120px;
    margin: 0 auto;
  }
  .search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .search-input {
    flex: 1;
    padding: 11px 16px;
    border: 1px solid var(--gray-line);
    border-radius: 8px;
    font-size: 14px;
    background: var(--white);
    color: var(--navy);
  }
  .search-input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--gray-line);
    background: var(--white);
    font-size: 13px;
    color: var(--gray-body);
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--blue); }
  .chip.active {
    background: var(--blue);
    border-color: var(--blue);
    color: var(--white);
  }
  .count-line {
    font-size: 12px;
    color: #8A95A0;
    margin: 14px 2px 18px;
  }

  /* Cards */
  .grid {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--gray-line);
    border-left: 4px solid var(--gray-line);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card.high { border-left-color: var(--red); }
  .card.mid { border-left-color: var(--amber); }
  .card.low { border-left-color: var(--gray-line); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .field-tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--blue);
    background: var(--blue-soft);
    padding: 3px 9px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .importance {
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .importance.high { color: var(--red); }
  .importance.mid { color: var(--amber); }
  .importance.low { color: #9AA3AB; }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.5;
  }
  .card-title a { color: inherit; text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }

  .card-summary {
    font-size: 13px;
    line-height: 1.7;
    color: var(--gray-body);
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    color: #9AA3AB;
    border-top: 1px solid var(--gray-line);
    padding-top: 10px;
    margin-top: 2px;
  }
  .source-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    background: #F1F3F5;
    color: #6B7580;
  }

  .empty-state {
    max-width: 1120px;
    margin: 40px auto;
    text-align: center;
    color: #9AA3AB;
    font-size: 14px;
    padding: 60px 20px;
  }
  .loading-state, .error-state {
    max-width: 1120px;
    margin: 40px auto;
    text-align: center;
    color: #9AA3AB;
    font-size: 14px;
    padding: 60px 20px;
  }
  .error-state { color: #B23A3A; }
  .retry-btn {
    margin-top: 12px;
    padding: 8px 18px;
    border: 1px solid var(--blue);
    color: var(--blue);
    background: var(--white);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title">ARTナレッジベース</div>
    <div class="header-sub">ARCS Inc. / 内部参照用プロトタイプ</div>
  </div>
  <div class="badge-confidential">CONFIDENTIAL</div>
</div>

<div class="toolbar">
  <div class="search-row">
    <input class="search-input" id="searchInput" type="text" placeholder="キーワードで検索(タイトル・要約)">
  </div>
  <div class="chip-row" id="fieldChips"></div>
  <div class="count-line" id="countLine"></div>
</div>

<div class="grid" id="cardGrid"></div>
<div class="empty-state" id="emptyState" style="display:none;">該当する記事がありません。検索条件を変えてみてください。</div>
<div class="loading-state" id="loadingState">データを読み込んでいます...</div>
<div class="error-state" id="errorState" style="display:none;">
  データの取得に失敗しました。<br>
  <button class="retry-btn" id="retryBtn">再読み込み</button>
</div>

<script>
// GAS Web App のURL(ARTナレッジベース スプレッドシート用API)
const API_URL = "https://script.google.com/a/macros/arcs-inc.jp/s/AKfycbydHNsQDTKuJHWL8a5I1e5hvO-NyfHVDRk2rsARNZ4-FuNNmQ-2ab1zOviRCvCmLTlcQA/exec";

const IMPORTANCE_MAP = { "高": "high", "中": "mid", "低": "low" };

const FIELDS = ["すべて", "ART/生殖医療テクノロジー動向", "規制・政策動向", "学術研究", "業界動向・統計"];
let activeField = "すべて";
let query = "";
let DATA = [];

async function loadData() {
  document.getElementById("loadingState").style.display = "block";
  document.getElementById("errorState").style.display = "none";
  document.getElementById("cardGrid").innerHTML = "";
  document.getElementById("emptyState").style.display = "none";

  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();

    DATA = (json.items || []).map(item => ({
      title: item["タイトル"],
      field: item["分野"],
      importance: IMPORTANCE_MAP[item["重要度"]] || "mid",
      importanceLabel: item["重要度"] || "中",
      summary: item["要約"],
      source: item["ソース種別"],
      poster: item["投稿者"],
      date: item["公開日"],
      url: item["元URL"]
    }));

    document.getElementById("loadingState").style.display = "none";
    render();
  } catch (err) {
    document.getElementById("loadingState").style.display = "none";
    document.getElementById("errorState").style.display = "block";
    console.error("データ取得エラー:", err);
  }
}

document.getElementById("retryBtn").addEventListener("click", loadData);

function renderChips() {
  const el = document.getElementById("fieldChips");
  el.innerHTML = FIELDS.map(f =>
    `<div class="chip ${f === activeField ? "active" : ""}" data-field="${f}">${f}</div>`
  ).join("");
  el.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeField = chip.dataset.field;
      render();
    });
  });
}

function render() {
  renderChips();
  const q = query.trim().toLowerCase();
  const filtered = DATA.filter(item => {
    const matchesField = activeField === "すべて" || item.field === activeField;
    const matchesQuery = !q || item.title.toLowerCase().includes(q) || item.summary.toLowerCase().includes(q);
    return matchesField && matchesQuery;
  });

  document.getElementById("countLine").textContent = `${filtered.length}件表示中(全${DATA.length}件)`;

  const grid = document.getElementById("cardGrid");
  const empty = document.getElementById("emptyState");

  if (filtered.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = filtered.map(item => `
    <div class="card ${item.importance}">
      <div class="card-top">
        <span class="field-tag">${item.field}</span>
        <span class="importance ${item.importance}">重要度: ${item.importanceLabel}</span>
      </div>
      <div class="card-title"><a href="${item.url}" target="_blank" rel="noopener">${item.title}</a></div>
      <div class="card-summary">${item.summary}</div>
      <div class="card-meta">
        <span class="source-badge">${item.source}${item.poster ? " ・ " + item.poster : ""}</span>
        <span>${item.date}</span>
      </div>
    </div>
  `).join("");
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  query = e.target.value;
  render();
});

loadData();
</script>

</body>
</html>
