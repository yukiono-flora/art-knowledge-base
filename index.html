<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTナレッジベース</title>
<style>
  :root {
    --navy: #1F3A52;
    --blue: #365D81;
    --blue-soft: #E8EEF3;
    --gray-body: #55606B;
    --gray-line: #DDE3E8;
    --bg: #FAFBFC;
    --white: #FFFFFF;
    --red: #B23A3A;
    --amber: #C08A2E;
    --green: #3D7A54;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
    color: #33393F;
    font-size: 15.5px;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  /* Header */
  .header {
    background: var(--white);
    border-bottom: 1px solid var(--gray-line);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: baseline; gap: 12px; }
  .header-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 0.02em;
  }
  .header-sub {
    font-size: 12px;
    color: #8A95A0;
  }
  .badge-confidential {
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* Toolbar */
  .toolbar {
    padding: 20px 32px 0;
    max-width: 1600px;
    margin: 0 auto;
  }
  .search-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }
  .search-input {
    flex: 1;
    padding: 11px 16px;
    border: 1px solid var(--gray-line);
    border-radius: 8px;
    font-size: 14px;
    background: var(--white);
    color: var(--navy);
  }
  .search-input:focus {
    outline: none;
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }
  .add-news-btn {
    padding: 0 20px;
    border: none;
    background: var(--blue);
    color: var(--white);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-news-btn:hover { background: var(--blue-dark); }
  .add-news-form {
    background: var(--white);
    border: 1px solid var(--gray-line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .form-row {
    display: flex;
    gap: 8px;
  }
  .form-row input, .form-row select, .add-news-form textarea {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--gray-line);
    border-radius: 7px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .add-news-submit-btn {
    padding: 9px 20px;
    border: none;
    background: var(--navy);
    color: var(--white);
    border-radius: 7px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .form-note {
    font-size: 12px;
    color: var(--blue);
    min-height: 16px;
  }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip {
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--gray-line);
    background: var(--white);
    font-size: 13px;
    color: var(--gray-body);
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--blue); }
  .chip.active {
    background: var(--blue);
    border-color: var(--blue);
    color: var(--white);
  }
  .count-line {
    font-size: 12px;
    color: #8A95A0;
    margin: 14px 2px 18px;
  }

  /* Cards */
  .grid {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 32px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--gray-line);
    border-radius: 10px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .field-tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--blue);
    background: var(--blue-soft);
    padding: 3px 9px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .new-badge {
    font-size: 11px;
    font-weight: 700;
    color: var(--white);
    background: var(--red);
    padding: 3px 9px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .card-top-right {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.5;
  }
  .card-title a { color: inherit; text-decoration: none; }
  .card-title a:hover { text-decoration: underline; }

  .card-summary {
    font-size: 13px;
    line-height: 1.7;
    color: var(--gray-body);
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    color: #9AA3AB;
    border-top: 1px solid var(--gray-line);
    padding-top: 10px;
    margin-top: 2px;
  }
  .source-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 5px;
    background: #F1F3F5;
    color: #6B7580;
  }
  .card-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .interest-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    border: 1px solid var(--gray-line);
    border-radius: 6px;
    background: var(--white);
    color: var(--gray-body);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .interest-btn:hover {
    border-color: var(--blue);
    color: var(--blue);
  }
  .interest-btn.active {
    background: var(--blue-soft);
    border-color: var(--blue);
    color: var(--blue);
    font-weight: 600;
  }
  .not-interest-btn.active {
    background: #F1E4E4;
    border-color: var(--red);
    color: var(--red);
    font-weight: 600;
  }
  .memo-section {
    border-top: 1px solid var(--gray-line);
    padding-top: 12px;
    margin-top: 2px;
  }
  .memo-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-body);
    margin-bottom: 8px;
    cursor: pointer;
  }
  .memo-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .memo-item {
    background: var(--bg);
    border-radius: 6px;
    padding: 7px 10px;
  }
  .memo-item-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .memo-author {
    font-size: 12px;
    font-weight: 600;
    color: var(--navy);
  }
  .memo-date {
    font-size: 11px;
    color: #9AA3AB;
  }
  .memo-content {
    font-size: 12.5px;
    color: var(--gray-body);
    line-height: 1.6;
  }
  .memo-input-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .memo-input-top-row {
    display: flex;
    gap: 6px;
  }
  .memo-name-input {
    width: 110px;
    flex-shrink: 0;
    padding: 7px 8px;
    border: 1px solid var(--gray-line);
    border-radius: 6px;
    font-size: 12.5px;
  }
  .memo-input {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--gray-line);
    border-radius: 6px;
    font-size: 12.5px;
  }
  .memo-submit-btn {
    align-self: flex-end;
    padding: 7px 16px;
    border: 1px solid var(--blue);
    background: var(--blue);
    color: var(--white);
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .memo-submit-btn:hover {
    background: var(--blue-dark);
  }

  .empty-state {
    max-width: 1120px;
    margin: 40px auto;
    text-align: center;
    color: #9AA3AB;
    font-size: 14px;
    padding: 60px 20px;
  }
  .loading-state, .error-state {
    max-width: 1120px;
    margin: 40px auto;
    text-align: center;
    color: #9AA3AB;
    font-size: 14px;
    padding: 60px 20px;
  }
  .error-state { color: #B23A3A; }
  .retry-btn {
    margin-top: 12px;
    padding: 8px 18px;
    border: 1px solid var(--blue);
    color: var(--blue);
    background: var(--white);
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-title">ARTナレッジベース</div>
    <div class="header-sub">ARCS Inc. / 内部参照用プロトタイプ</div>
  </div>
  <div class="badge-confidential">CONFIDENTIAL</div>
</div>

<div class="toolbar">
  <div class="search-row">
    <input class="search-input" id="searchInput" type="text" placeholder="キーワードで検索(タイトル・要約)">
    <button class="add-news-btn" id="addNewsBtn">+ ニュースを追加</button>
  </div>
  <div class="add-news-form" id="addNewsForm" style="display:none;">
    <div class="form-row">
      <input type="text" id="formTitle" placeholder="タイトル(必須)">
      <input type="text" id="formUrl" placeholder="URL">
    </div>
    <div class="form-row">
      <select id="formField">
        <option value="">分野を選択</option>
        <option>ART/生殖医療テクノロジー動向</option>
        <option>規制・政策動向</option>
        <option>学術研究</option>
        <option>業界動向・統計</option>
      </select>
      <input type="text" id="formCountry" placeholder="国(例: 日本, アメリカ)">
      <select id="formImportance">
        <option value="中">重要度: 中</option>
        <option value="高">重要度: 高</option>
        <option value="低">重要度: 低</option>
      </select>
    </div>
    <textarea id="formSummary" placeholder="要約・コメント" rows="2"></textarea>
    <div class="form-row">
      <input type="text" id="formAuthor" placeholder="お名前(任意)">
      <button class="add-news-submit-btn" id="addNewsSubmitBtn">登録する</button>
    </div>
    <div class="form-note" id="formNote"></div>
  </div>
  <div class="chip-row" id="fieldChips"></div>
  <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
    <span style="font-size:12px; color:#8A95A0; flex-shrink:0;">国:</span>
    <div class="chip-row" id="regionChips" style="margin-bottom:0;"></div>
  </div>
  <div class="count-line" id="countLine"></div>
</div>

<div class="grid" id="cardGrid"></div>
<div class="empty-state" id="emptyState" style="display:none;">該当する記事がありません。検索条件を変えてみてください。</div>
<div class="loading-state" id="loadingState">データを読み込んでいます...</div>
<div class="error-state" id="errorState" style="display:none;">
  データの取得に失敗しました。<br>
  <button class="retry-btn" id="retryBtn">再読み込み</button>
</div>

<script>
// GAS Web App のURL(ARTナレッジベース スプレッドシート用API)
const API_URL = "https://script.google.com/a/macros/arcs-inc.jp/s/AKfycbydHNsQDTKuJHWL8a5I1e5hvO-NyfHVDRk2rsARNZ4-FuNNmQ-2ab1zOviRCvCmLTlcQA/exec";

const IMPORTANCE_MAP = { "高": "high", "中": "mid", "低": "low" };

const FIELDS = ["すべて", "ART/生殖医療テクノロジー動向", "規制・政策動向", "学術研究", "業界動向・統計"];
let REGIONS = ["すべて"];
let activeField = "すべて";
let activeRegion = "すべて";
let query = "";

function updateRegionsFromData() {
  const uniqueRegions = [...new Set(DATA.map(item => item.region).filter(Boolean))];
  uniqueRegions.sort((a, b) => a.localeCompare(b, "ja")); // あいうえお順
  REGIONS = ["すべて", ...uniqueRegions];
}
let DATA = [];
let MEMOS = {}; // { "記事ID": [{author, content, date}, ...] }

// GAS Web AppはCORSに対応していないため、<script>タグを使うJSONP方式でデータを取得する
function loadData() {
  document.getElementById("loadingState").style.display = "block";
  document.getElementById("errorState").style.display = "none";
  document.getElementById("cardGrid").innerHTML = "";
  document.getElementById("emptyState").style.display = "none";

  const callbackName = "artKbCallback_" + Date.now();
  let settled = false;

  const timeoutId = setTimeout(() => {
    if (!settled) {
      settled = true;
      handleLoadError(new Error("タイムアウト"));
    }
  }, 15000);

  window[callbackName] = function (json) {
    if (settled) return;
    settled = true;
    clearTimeout(timeoutId);
    delete window[callbackName];
    script.remove();

    DATA = (json.items || []).map(item => ({
      id: item["ID"],
      title: item["タイトル"],
      field: item["分野"],
      importance: IMPORTANCE_MAP[item["重要度"]] || "mid",
      importanceLabel: item["重要度"] || "中",
      summary: item["要約"],
      source: item["ソース種別"],
      poster: item["投稿者"],
      date: item["公開日"],
      registeredAt: item["登録日時"],
      region: item["国"] || "",
      url: item["元URL"]
    }));

    // 新着順(記事の公開日が新しい順)に並び替え
    DATA.sort((a, b) => new Date(b.date) - new Date(a.date));

    MEMOS = json.memos || {};

    updateRegionsFromData();

    document.getElementById("loadingState").style.display = "none";
    render();
  };

  const script = document.createElement("script");
  script.src = API_URL + "?callback=" + callbackName;
  script.onerror = () => {
    if (!settled) {
      settled = true;
      clearTimeout(timeoutId);
      delete window[callbackName];
      handleLoadError(new Error("スクリプト読み込み失敗"));
    }
  };
  document.body.appendChild(script);
}

function handleLoadError(err) {
  document.getElementById("loadingState").style.display = "none";
  document.getElementById("errorState").style.display = "block";
  console.error("データ取得エラー:", err);
}

document.getElementById("retryBtn").addEventListener("click", loadData);

function renderChips() {
  const fieldEl = document.getElementById("fieldChips");
  fieldEl.innerHTML = FIELDS.map(f =>
    `<div class="chip ${f === activeField ? "active" : ""}" data-field="${f}">${f}</div>`
  ).join("");
  fieldEl.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeField = chip.dataset.field;
      render();
    });
  });

  const regionEl = document.getElementById("regionChips");
  regionEl.innerHTML = REGIONS.map(r =>
    `<div class="chip ${r === activeRegion ? "active" : ""}" data-region="${r}">${r}</div>`
  ).join("");
  regionEl.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeRegion = chip.dataset.region;
      render();
    });
  });
}

function render() {
  renderChips();
  const q = query.trim().toLowerCase();
  const filtered = DATA.filter(item => {
    const matchesField = activeField === "すべて" || item.field === activeField;
    const matchesRegion = activeRegion === "すべて" || item.region === activeRegion;
    const matchesQuery = !q || item.title.toLowerCase().includes(q) || item.summary.toLowerCase().includes(q);
    return matchesField && matchesRegion && matchesQuery;
  });

  document.getElementById("countLine").textContent = `${filtered.length}件表示中(全${DATA.length}件)`;

  const grid = document.getElementById("cardGrid");
  const empty = document.getElementById("emptyState");

  if (filtered.length === 0) {
    grid.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  grid.innerHTML = filtered.map(item => `
    <div class="card">
      <div class="card-top">
        <span class="field-tag">${item.field}</span>
        <div class="card-top-right">
          ${item.region ? `<span class="field-tag" style="background:#F1F3F5;color:#6B7580;">${item.region}</span>` : ""}
          ${isNewItem(item.date) ? '<span class="new-badge">🆕 NEW</span>' : ""}
        </div>
      </div>
      <div class="card-title"><a href="${item.url}" target="_blank" rel="noopener">${item.title}</a></div>
      <div class="card-summary">${item.summary}</div>
      <div class="card-meta">
        <span class="source-badge">${item.source}${item.poster ? " ・ " + item.poster : ""}</span>
        <span>${item.date}</span>
      </div>
      <div class="card-actions">
        <button class="interest-btn ${feedbackState[item.id] === "interested" ? "active" : ""}"
          data-id="${item.id}" data-title="${escapeAttr(item.title)}" data-field="${escapeAttr(item.field)}" data-type="interested">
          👍 興味あり
        </button>
        <button class="interest-btn not-interest-btn ${feedbackState[item.id] === "not_interested" ? "active" : ""}"
          data-id="${item.id}" data-title="${escapeAttr(item.title)}" data-field="${escapeAttr(item.field)}" data-type="not_interested">
          👎 興味なし
        </button>
      </div>
      <div class="memo-section">
        <div class="memo-header" data-toggle-id="${item.id}">💬 メモ ${(MEMOS[item.id] || []).length}件 <span style="font-size:11px;color:#9AA3AB;">(クリックで開閉)</span></div>
        <div class="memo-body" data-body-id="${item.id}" style="display:none;">
          <div class="memo-list">
            ${(MEMOS[item.id] || []).map(m => `
              <div class="memo-item">
                <div class="memo-item-top">
                  <span class="memo-author">${escapeAttr(m.author)}</span>
                  <span class="memo-date">${escapeAttr(m.date)}</span>
                </div>
                <div class="memo-content">${escapeAttr(m.content)}</div>
              </div>
            `).join("")}
          </div>
          <div class="memo-input-row">
            <div class="memo-input-top-row">
              <input type="text" class="memo-name-input" placeholder="お名前(任意)" data-id="${item.id}" value="${escapeAttr(savedAuthorName)}">
              <input type="text" class="memo-input" placeholder="気づいたことをメモ..." data-id="${item.id}">
            </div>
            <button class="memo-submit-btn" data-id="${item.id}">投稿</button>
          </div>
        </div>
      </div>
    </div>
  `).join("");

  grid.querySelectorAll(".interest-btn").forEach(btn => {
    btn.addEventListener("click", () => onInterestClick(btn));
  });
  grid.querySelectorAll(".memo-submit-btn").forEach(btn => {
    btn.addEventListener("click", () => onMemoSubmit(btn));
  });
  grid.querySelectorAll(".memo-input").forEach(input => {
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const btn = grid.querySelector(`.memo-submit-btn[data-id="${input.dataset.id}"]`);
        onMemoSubmit(btn);
      }
    });
  });
  grid.querySelectorAll(".memo-header").forEach(header => {
    header.addEventListener("click", () => {
      const body = grid.querySelector(`.memo-body[data-body-id="${header.dataset.toggleId}"]`);
      body.style.display = body.style.display === "none" ? "block" : "none";
    });
  });
}

function onMemoSubmit(btn) {
  const id = btn.dataset.id;
  const input = document.querySelector(`.memo-input[data-id="${id}"]`);
  const nameInput = document.querySelector(`.memo-name-input[data-id="${id}"]`);
  const content = input.value.trim();
  if (!content) return;

  const rawName = nameInput.value.trim();
  const author = rawName || "匿名";
  localStorage.setItem("artKbAuthorName", rawName); // 空欄なら次回も空欄のまま(=匿名希望を記憶)
  savedAuthorName = rawName;

  if (!MEMOS[id]) MEMOS[id] = [];
  MEMOS[id].push({ author, content, date: "たった今" });
  input.value = "";
  render();

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    credentials: "include",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "addMemo", id: id, author: author, content: content })
  }).catch(err => console.error("メモ送信エラー:", err));
}

function escapeAttr(str) {
  return String(str || "").replace(/"/g, "&quot;");
}

function isNewItem(publishDate) {
  if (!publishDate) return false;
  const published = new Date(publishDate);
  const hoursSince = (Date.now() - published.getTime()) / 3600000;
  return hoursSince <= 48; // 公開から48時間以内はNEW扱い
}

// { "記事ID": "interested" | "not_interested" } の形でブラウザに保存
let feedbackState = JSON.parse(localStorage.getItem("artKbFeedback") || "{}");
let savedAuthorName = localStorage.getItem("artKbAuthorName") || "";

function onInterestClick(btn) {
  const id = btn.dataset.id;
  const type = btn.dataset.type; // "interested" or "not_interested"
  const current = feedbackState[id];

  // 同じボタンをもう一度押したら「取り消し(未評価に戻す)」
  const newState = current === type ? null : type;

  if (newState) {
    feedbackState[id] = newState;
  } else {
    delete feedbackState[id];
  }
  localStorage.setItem("artKbFeedback", JSON.stringify(feedbackState));
  render(); // ボタンの見た目を更新

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    credentials: "include",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      action: "feedback",
      id: id,
      title: btn.dataset.title,
      field: btn.dataset.field,
      type: newState || "cancel" // 取り消した場合は "cancel" として記録
    })
  }).catch(err => console.error("フィードバック送信エラー:", err));
}

document.getElementById("searchInput").addEventListener("input", (e) => {
  query = e.target.value;
  render();
});

document.getElementById("addNewsBtn").addEventListener("click", () => {
  const form = document.getElementById("addNewsForm");
  form.style.display = form.style.display === "none" ? "flex" : "none";
});

document.getElementById("addNewsSubmitBtn").addEventListener("click", () => {
  const title = document.getElementById("formTitle").value.trim();
  if (!title) {
    document.getElementById("formNote").textContent = "タイトルは必須です";
    return;
  }

  const payload = {
    action: "manualAdd",
    title: title,
    url: document.getElementById("formUrl").value.trim(),
    field: document.getElementById("formField").value,
    country: document.getElementById("formCountry").value.trim(),
    importance: document.getElementById("formImportance").value,
    summary: document.getElementById("formSummary").value.trim(),
    author: document.getElementById("formAuthor").value.trim()
  };

  fetch(API_URL, {
    method: "POST",
    mode: "no-cors",
    credentials: "include",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).catch(err => console.error("手動追加エラー:", err));

  document.getElementById("formNote").textContent = "送信しました。数秒後に画面を再読み込みすると反映されます。";
  ["formTitle","formUrl","formCountry","formSummary"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("formField").value = "";
  document.getElementById("formImportance").value = "中";
});

loadData();
</script>

</body>
</html>
